name: CloudQA Task 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  HEADLESS: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build & Compile (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution in Release Mode
        run: dotnet build --no-restore -c Release

  controlled-resilience-tests:
    name: Controlled Suites (Resilience, Stale Recovery, SafeClick, Combobox)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Execute Controlled Tests Suite (34 Tests)
        env:
          HEADLESS: "true"
        run: >
          dotnet test --no-build -c Release 
          --filter "Category=Resilience | Category=StaleRecovery | Category=SafeClick | Category=CustomCombobox" 
          --logger "trx;LogFileName=controlled_results.trx" 
          -- NUnit.Headless="true"

      - name: Upload Controlled Test Results & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-test-results
          path: |
            **/TestResults/*.trx
            Screenshots/*.png

  browser-verification-tests:
    name: Browser Verification & Settings Suite
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Execute Browser Verification Tests
        env:
          HEADLESS: "true"
        run: >
          dotnet test --no-build -c Release 
          --filter "Category=BrowserVerification" 
          --logger "trx;LogFileName=browser_results.trx" 
          -- NUnit.Headless="true"

      - name: Upload Browser Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: '**/TestResults/*.trx'

  live-e2e-smoke-tests:
    name: Live Site E2E Smoke Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Execute Live Practice Form E2E Tests
        env:
          HEADLESS: "true"
          TARGET_URL: "https://app.cloudqa.io/home/AutomationPracticeForm"
        run: >
          dotnet test --no-build -c Release 
          --filter "Category=E2E" 
          --logger "trx;LogFileName=e2e_results.trx" 
          -- NUnit.Headless="true"

      - name: Upload E2E Test Results & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-results
          path: |
            **/TestResults/*.trx
            Screenshots/*.png
