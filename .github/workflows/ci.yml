name: Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Resilient Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore -c Release

      - name: Run Controlled Resilience Mutation Tests
        run: >
          dotnet test --no-build -c Release 
          --filter "Category=Resilience" 
          --logger "trx;LogFileName=resilience_results.trx" 
          -- NUnit.Headless="true"

      - name: Run Live E2E Smoke Tests
        continue-on-error: true
        run: >
          dotnet test --no-build -c Release 
          --filter "Category=E2E" 
          --logger "trx;LogFileName=e2e_results.trx" 
          -- NUnit.Headless="true"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

